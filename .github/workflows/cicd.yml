name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Batalkan run lama pada ref yang sama bila ada push baru
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # CHECKS — jalan paralel di setiap PR & push (gate sebelum deploy)
  # ---------------------------------------------------------------
  api-check:
    name: API (Go) — vet · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/api/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -count=1

  web-check:
    name: Dashboard (Vite) — lint · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test -- --passWithNoTests
      - run: pnpm build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:8080/api' }}

  # ---------------------------------------------------------------
  # BUILD & PUSH IMAGE — hanya saat push ke main, setelah checks hijau
  # api & dashboard dibangun PARALEL lewat matrix
  # ---------------------------------------------------------------
  build:
    name: Build & push (${{ matrix.app }})
    needs: [api-check, web-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: api
            context: ./apps/api
            image: alizzah-api
          - app: dashboard
            context: ./apps/dashboard
            image: alizzah-dashboard
    steps:
      - uses: actions/checkout@v4
      - name: Owner huruf kecil (syarat GHCR)
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # secrets HANYA boleh di step (bukan di matrix). VITE_API_URL di-bake khusus dashboard.
          build-args: ${{ matrix.app == 'dashboard' && format('VITE_API_URL={0}', secrets.VITE_API_URL) || '' }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}:latest
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # ---------------------------------------------------------------
  # DEPLOY — SSH ke VPS, tarik image baru, restart stack
  # ---------------------------------------------------------------
  deploy:
    name: Deploy ke VPS
    needs: build
    runs-on: ubuntu-latest
    environment: ANASLABS_VPS   # agar bisa baca secret VPS_HOST/USER/KEY
    steps:
      - name: SSH & docker compose up
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            # Paksa direktori deploy persis sama dengan main (apa pun branch lokalnya).
            # .env aman karena gitignored.
            git fetch origin main
            git reset --hard origin/main
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi
            export IMAGE_OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
            export IMAGE_TAG="${{ github.sha }}"
            docker compose pull
            docker compose up -d
            docker image prune -f
