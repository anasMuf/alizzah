  /v1/audit-logs:
    get:
      consumes:
      - application/json
      description: Get paginated audit log entries (superadmin only). Filterable by
        module, method, status, date range, user, and free-text search.
      parameters:
      - description: Search by path, error message, or user name
        in: query
        name: search
        type: string
      - description: Filter by user ID
        in: query
        name: user_id
        type: integer
      - description: Filter by module (administrasi|keuangan|koperasi|laporan|pengaturan|auth)
        in: query
        name: module
        type: string
      - description: Filter by HTTP method (POST|PUT|PATCH|DELETE)
        in: query
        name: method
        type: string
      - description: Filter status >= N
        in: query
        name: status_min
        type: integer
      - description: Filter status <= N
        in: query
        name: status_max
        type: integer
      - description: Filter from date (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: Filter to date (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.AuditLogResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List audit logs
      tags:
      - audit-logs
  /v1/audit-logs/{id}:
    get:
      consumes:
      - application/json
      description: Get a single audit log entry with full request body (superadmin
        only)
