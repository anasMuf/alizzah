    required:
    - status
    type: object
  dto.UpdateFeeConfigRequest:
    properties:
      savings_admin_rate:
        maximum: 100
        minimum: 0
        type: number
    required:
    - savings_admin_rate
    type: object
  dto.UpdateInstallmentRequest:
    properties:
      amount:
        minimum: 1
        type: number
      due_date:
        type: string
      notes:
        type: string
    required:
    - amount
    - due_date
    type: object
  dto.UpdateInvoiceItemRequest:
    properties:
      amount:
        minimum: 1
        type: number
      name:
        maxLength: 100
        type: string
