        type: string
      notes:
        type: string
      payment_date:
        type: string
    required:
    - amount
    - payment_date
    type: object
  penjualan.Response:
    properties:
      academic_year_id:
        type: integer
      buyer_name:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/penjualan.ItemResponse'
        type: array
      notes:
        type: string
      paid_amount:
        type: number
      profit:
        description: Σ (unit_price - unit_cost) × qty
        type: number
      remaining:
        type: number
      sale_date:
        type: string
      source:
        type: string
      status:
        type: string
      student_id:
        type: integer
      student_name:
        type: string
      total_amount:
        type: number
    type: object
  pinjaman.CreateRequest:
    properties:
      academic_year_id:
        type: integer
      loan_date:
        type: string
      member_id:
        type: integer
      notes:
        type: string
      principal:
        type: number
      purpose:
        maxLength: 255
        type: string
      repayment_method:
