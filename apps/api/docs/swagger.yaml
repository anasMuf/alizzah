      tags:
      - backup
    post:
      consumes:
      - application/json
      description: 'Trigger full database backup. Format: dump (custom -Fc), sql (plain
        -Fp), sql-compat (plain tanpa restrict/unrestrict). Default: dump.'
      parameters:
      - description: 'Format backup: dump, sql, sql-compat'
        in: query
        name: format
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/service.BackupResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
