        type: integer
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: integer
      installments:
        items:
          $ref: '#/definitions/pinjaman.InstallmentResponse'
        type: array
      loan_date:
        type: string
      member_id:
        type: integer
      member_name:
        type: string
      notes:
        type: string
      paid_amount:
        type: number
      principal:
        type: number
      purpose:
        type: string
      remaining:
        type: number
      repayment_method:
        type: string
      status:
        type: string
      tenor:
        type: integer
    type: object
  pinjaman.SummaryItem:
    properties:
      loan_count:
        type: integer
      member_id:
        type: integer
      member_name:
        type: string
      remaining:
        type: number
      total_paid:
        type: number
      total_principal:
        type: number
    type: object
  service.BackupFileInfo:
    properties:
      filename:
        type: string
      format:
        description: '"dump" / "sql" / "sql-compat"'
        type: string
      size_bytes:
        type: integer
      size_human:
        type: string
      timestamp:
        type: string
