    - amount
    - name
    type: object
  dto.UpdateStudentExtracurricularRequest:
    properties:
      end_date:
        type: string
    required:
    - end_date
    type: object
  dto.UpdateStudentRequest:
    properties:
      birth_date:
        type: string
      birth_place:
        maxLength: 100
        type: string
      full_name:
        maxLength: 100
        minLength: 3
        type: string
      gender:
        enum:
        - L
        - P
        type: string
      is_daycare_only:
        type: boolean
      religion:
        maxLength: 30
        type: string
    required:
    - birth_date
    - birth_place
    - full_name
    - gender
    type: object
  dto.UpdateUserRequest:
    properties:
      email:
        type: string
      full_name:
        maxLength: 100
        minLength: 3
        type: string
      password:
        minLength: 8
        type: string
      role:
        enum:
        - superadmin
        - admin_administrasi
        - admin_keuangan
        - kepala_sekolah
        - yayasan
        type: string
    required:
    - email
    - full_name
    - role
    type: object
  dto.UpsertEffectiveDayRequest:
    properties:
      academic_year_id:
        type: integer
      month:
        maximum: 12
        minimum: 1
        type: integer
      total_days:
        maximum: 31
        minimum: 0
        type: integer
      total_mondays:
        maximum: 5
        minimum: 0
        type: integer
      year:
        minimum: 2020
        type: integer
    required:
    - academic_year_id
    - month
    - total_days
    - total_mondays
    - year
    type: object
  dto.UserBriefResponse:
    properties:
      full_name:
        type: string
      id:
        type: integer
    type: object
  dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      role:
        type: string
    type: object
  dto.VaultBalanceResponse:
    properties:
      balance:
        type: number
      total_savings_general:
        type: number
      total_savings_mandatory:
        type: number
    type: object
  dto.VaultSummaryResponse:
    properties:
      balance:
        type: number
    type: object
  dto.VaultTransactionResponse:
    properties:
      amount:
        type: number
      created_by:
        $ref: '#/definitions/dto.UserBriefResponse'
      description:
        type: string
      id:
        type: integer
      source_id:
        type: integer
      source_type:
        type: string
      transaction_date:
        type: string
      transaction_type:
        type: string
    type: object
  dto.WithdrawalRequest:
    properties:
      event_date:
        type: string
      event_type:
        enum:
        - transfer_out
        - dropout
        type: string
      notes:
        type: string
      student_id:
        type: integer
    required:
    - event_date
    - event_type
    - student_id
    type: object
  dto.WithdrawalResponse:
    properties:
      admin_fee:
        type: number
      amount:
        type: number
      net_amount:
        type: number
      remaining_balance:
        type: number
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for Alizzah School Management System
  title: Alizzah Manajemen API
  version: "1.0"
paths:
  /v1/academic-events/class-changes:
    post:
      consumes:
      - application/json
      description: Process class change (pindah rombel) for a student within the same
        level
      parameters:
      - description: Class change data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ClassChangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Process class change
      tags:
      - academic-events
  /v1/academic-events/graduations:
    post:
      consumes:
      - application/json
      description: Process graduation of students from the highest class group
      parameters:
      - description: Graduation data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.GraduationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.GraduationResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Process student graduation
      tags:
      - academic-events
  /v1/academic-events/promotions:
    post:
      consumes:
      - application/json
      description: Process promotion of students to the next class group
      parameters:
      - description: Promotion data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.PromotionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.PromotionResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Process student promotion
      tags:
      - academic-events
  /v1/academic-events/transfers:
    post:
      consumes:
      - application/json
      description: Process transfer in (mutasi masuk) for a student
      parameters:
      - description: Transfer in data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.TransferInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Process transfer in
      tags:
      - academic-events
  /v1/academic-events/withdrawals:
    post:
      consumes:
      - application/json
      description: Process withdrawal (pindah/keluar sekolah) for a student
      parameters:
      - description: Withdrawal data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.WithdrawalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Process withdrawal
      tags:
      - academic-events
  /v1/academic-years:
    get:
      consumes:
      - application/json
      description: Get all academic years ordered by start_date descending
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.AcademicYearResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List all academic years
      tags:
      - academic-years
    post:
      consumes:
      - application/json
      description: Create a new academic year (superadmin, admin_administrasi)
      parameters:
      - description: Academic year data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAcademicYearRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AcademicYearResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Create a new academic year
      tags:
      - academic-years
  /v1/academic-years/{id}:
    get:
      consumes:
      - application/json
      description: Get a single academic year's detail
      parameters:
      - description: Academic Year ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AcademicYearResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get academic year by ID
      tags:
      - academic-years
    put:
      consumes:
      - application/json
      description: Update academic year data
      parameters:
      - description: Academic Year ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAcademicYearRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AcademicYearResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Update an academic year
      tags:
      - academic-years
  /v1/academic-years/{id}/activate:
    patch:
      consumes:
      - application/json
      description: Set an academic year as active (deactivates all others)
      parameters:
      - description: Academic Year ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Activate an academic year
      tags:
      - academic-years
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password, returns JWT token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Login user
      tags:
      - auth
  /v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Logout current user (client should discard the token)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Logout user
      tags:
      - auth
  /v1/auth/me:
    get:
      consumes:
      - application/json
      description: Get the profile of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get current user
      tags:
      - auth
  /v1/cash/balance:
    get:
      consumes:
      - application/json
      description: Get current cash balance and today's summary
      parameters:
      - description: Academic Year ID
        in: query
        name: academic_year_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CashBalanceResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get cash balance
      tags:
      - cash
  /v1/cash/transactions:
    get:
      consumes:
      - application/json
      description: Get a paginated list of cash transactions
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Limit per page
        in: query
        name: limit
        type: integer
      - description: Academic Year ID
        in: query
        name: academic_year_id
        type: integer
      - description: Transaction Type (credit/debit)
        in: query
        name: transaction_type
