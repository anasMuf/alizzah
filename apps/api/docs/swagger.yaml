basePath: /api
definitions:
  anggota.BulkCreateRequest:
    properties:
      members:
        items:
          $ref: '#/definitions/anggota.CreateRequest'
        minItems: 1
        type: array
    required:
    - members
    type: object
  anggota.CreateRequest:
    properties:
      address:
        type: string
      employee_id:
        type: integer
      full_name:
        maxLength: 100
        type: string
      is_active:
        type: boolean
      member_type:
        enum:
        - pegawai
        - pengurus_yayasan
        - pihak_luar
        type: string
      phone:
        maxLength: 20
        type: string
    required:
    - full_name
    - member_type
    type: object
  anggota.DetailResponse:
    properties:
      address:
        type: string
      employee_id:
        type: integer
      employee_name:
        type: string
      full_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      loan_summary:
        $ref: '#/definitions/anggota.LoanSummary'
      member_type:
        type: string
      phone:
        type: string
    type: object
  anggota.EmployeeResponse:
    properties:
      full_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      join_date:
        type: string
      legacy_id:
        type: integer
    type: object
  anggota.LoanSummary:
    properties:
      active_loan_count:
        type: integer
      total_paid:
        type: number
      total_principal:
        type: number
      total_remaining:
        type: number
    type: object
  anggota.Response:
    properties:
      address:
        type: string
      employee_id:
        type: integer
      employee_name:
        type: string
      full_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      member_type:
        type: string
      phone:
        type: string
    type: object
  barang.CreateRequest:
    properties:
      category:
        maxLength: 50
        type: string
      cost_price:
        description: 'Legacy single-variant (form barang lama): harga & stok satu
          varian default.'
        minimum: 0
        type: number
      is_active:
        type: boolean
      name:
        maxLength: 100
        type: string
      sale_price:
        minimum: 0
        type: number
      stock:
        minimum: 0
        type: integer
      unit:
        maxLength: 20
        type: string
      variants:
        description: |-
          Varian eksplisit (form barang ber-varian). Bila kosong, field legacy di bawah
          dipakai untuk membuat/memperbarui satu varian "Default" (kompatibilitas form lama).
        items:
          $ref: '#/definitions/barang.VariantRequest'
        type: array
    required:
    - name
    type: object
  barang.Response:
    properties:
      category:
        type: string
      cost_price:
        description: |-
          Agregat kompatibilitas (sampai FE varian): harga varian default/pertama &
          total stok seluruh varian — agar tabel & picker lama tetap berfungsi.
        type: number
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      sale_price:
        type: number
      stock:
        type: integer
      unit:
        type: string
      variant_count:
        type: integer
      variants:
        items:
          $ref: '#/definitions/barang.VariantResponse'
        type: array
    type: object
  barang.VariantRequest:
    properties:
      cost_price:
        minimum: 0
        type: number
      id:
        type: integer
      is_active:
        type: boolean
      name:
        maxLength: 50
        type: string
      sale_price:
        minimum: 0
        type: number
      stock:
        description: stok awal varian baru; update diabaikan
        minimum: 0
        type: integer
    type: object
  barang.VariantResponse:
    properties:
      cost_price:
        type: number
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      sale_price:
        type: number
      stock:
        type: integer
    type: object
  dto.AcademicEventResponse:
    properties:
      academic_year:
        $ref: '#/definitions/dto.AcademicYearBriefResponse'
      created_at:
        type: string
      created_by:
        $ref: '#/definitions/dto.UserBriefResponse'
      event_date:
        type: string
      event_type:
        type: string
      from_class_group:
        $ref: '#/definitions/dto.ClassGroupBriefResponse'
      id:
        type: integer
      notes:
        type: string
      to_class_group:
        $ref: '#/definitions/dto.ClassGroupBriefResponse'
    type: object
  dto.AcademicYearBriefResponse:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  dto.AcademicYearResponse:
    properties:
      created_at:
        type: string
      end_date:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      start_date:
        type: string
    type: object
  dto.AddInvoiceItemRequest:
    properties:
      amount:
        minimum: 1
        type: number
      category:
        type: string
      name:
        maxLength: 100
        type: string
    required:
    - amount
    - category
    - name
    type: object
  dto.AnnualExpenseSummary:
    properties:
      total:
        type: number
    type: object
  dto.AnnualIncomeSummary:
    properties:
      total_billed:
        type: number
      total_paid:
        type: number
      total_unpaid:
        type: number
    type: object
  dto.AnnualReportResponse:
    properties:
      academic_year:
        type: string
      by_month:
        items:
          $ref: '#/definitions/dto.MonthlyBreakdown'
        type: array
      cash_balance:
        type: number
      expense_summary:
        $ref: '#/definitions/dto.AnnualExpenseSummary'
      income_summary:
        $ref: '#/definitions/dto.AnnualIncomeSummary'
      net:
        type: number
      vault_balance:
        type: number
    type: object
  dto.AuditLogResponse:
    properties:
      action:
        type: string
      created_at:
        type: string
      error_message:
        type: string
      id:
        type: integer
      ip_address:
        type: string
      latency_ms:
        type: integer
      method:
        type: string
      module:
        type: string
      path:
        type: string
      request_body:
        type: string
      response_body:
        type: string
      status_code:
        type: integer
      user_id:
        type: integer
      user_name:
        type: string
    type: object
  dto.BilledVsPaid:
    properties:
      billed:
        type: number
      category:
        type: string
      paid:
        type: number
    type: object
  dto.CashBalanceResponse:
    properties:
      balance:
        type: number
      last_closing_date:
        type: string
      today_credit:
        type: number
      today_debit:
        type: number
      total_savings_mandatory:
        type: number
      total_savings_mandatory_berlian:
        type: number
      total_savings_mandatory_mutiara:
        type: number
    type: object
  dto.CashSummaryResponse:
    properties:
      closing_balance:
        type: number
      opening_balance:
        type: number
      total_credit:
        type: number
      total_debit:
        type: number
    type: object
  dto.CashTransactionResponse:
    properties:
      amount:
        type: number
      created_by:
        $ref: '#/definitions/dto.UserBriefResponse'
      description:
        type: string
      id:
        type: integer
      source_id:
        type: integer
      source_type:
        type: string
      transaction_date:
        type: string
      transaction_type:
        type: string
    type: object
  dto.CategoryAmount:
    properties:
      amount:
        type: number
      category:
        type: string
      sub_category:
        type: string
    type: object
  dto.ClassArrearSummary:
    properties:
      class_group_name:
        type: string
      student_count:
        type: integer
      total_unpaid:
        type: number
    type: object
  dto.ClassChangeRequest:
    properties:
      event_date:
        type: string
      from_class_group_id:
        type: integer
      notes:
        type: string
      student_id:
        type: integer
      to_class_group_id:
        type: integer
    required:
    - event_date
    - from_class_group_id
    - student_id
    - to_class_group_id
    type: object
  dto.ClassGroupBriefResponse:
    properties:
      id:
        type: integer
      level:
        type: string
      name:
        type: string
    type: object
  dto.ClassGroupMapping:
    properties:
      from_class_group_id:
        type: integer
      to_class_group_id:
        type: integer
    required:
    - from_class_group_id
    - to_class_group_id
    type: object
  dto.ClassGroupReportResponse:
    properties:
      class_group:
        $ref: '#/definitions/dto.ClassGroupBriefResponse'
      period:
        type: string
      students:
        items:
          $ref: '#/definitions/dto.StudentPaymentStatusInReport'
        type: array
      summary:
        $ref: '#/definitions/dto.ClassGroupReportSummary'
    type: object
  dto.ClassGroupReportSummary:
    properties:
      payment_rate:
        type: string
      total_billed:
        type: number
      total_paid:
        type: number
      total_students:
        type: integer
      total_unpaid:
        type: number
    type: object
  dto.ClassGroupResponse:
    properties:
      academic_year_id:
        type: integer
      id:
        type: integer
      is_mutation:
        type: boolean
      level:
        type: string
      name:
        type: string
      schedule:
        $ref: '#/definitions/dto.ClassGroupSchedule'
      student_count:
        type: integer
    type: object
  dto.ClassGroupSchedule:
    properties:
      weekdays:
        $ref: '#/definitions/dto.ScheduleBlock'
      weekend:
        $ref: '#/definitions/dto.ScheduleBlock'
    type: object
  dto.CloneClassGroupsRequest:
    properties:
      from_academic_year_id:
        type: integer
      to_academic_year_id:
        type: integer
    required:
    - from_academic_year_id
    - to_academic_year_id
    type: object
  dto.CloneClassGroupsResult:
    properties:
      created:
        type: integer
      groups:
        items:
          $ref: '#/definitions/dto.ClassGroupResponse'
        type: array
      skipped:
        type: integer
    type: object
  dto.ConfirmDailyClosingRequest:
    properties:
      notes:
        type: string
    type: object
  dto.CreateAcademicYearRequest:
    properties:
      end_date:
        type: string
      name:
        maxLength: 20
        type: string
      start_date:
        type: string
    required:
    - end_date
    - name
    - start_date
    type: object
  dto.CreateClassGroupRequest:
    properties:
      academic_year_id:
        type: integer
      is_mutation:
        type: boolean
      level:
        enum:
        - mutiara
        - intan
        - berlian
        type: string
      name:
        maxLength: 50
        type: string
      schedule:
        $ref: '#/definitions/dto.ClassGroupSchedule'
    required:
    - academic_year_id
    - level
    - name
    - schedule
    type: object
  dto.CreateDailyClosingRequest:
    properties:
      academic_year_id:
        type: integer
      closing_date:
        type: string
      notes:
        type: string
      physical_cash_amount:
        minimum: 0
        type: number
    required:
    - academic_year_id
    - closing_date
    - physical_cash_amount
    type: object
  dto.CreateDaycareEnrollmentRequest:
    properties:
      academic_year_id:
        type: integer
      age_group:
        enum:
        - kbtk
        - under3
        type: string
      category:
        enum:
        - premium
        - regular
        type: string
      enrollment_type:
        description: hanya untuk premium
        enum:
        - baru
        - lanjutan
        type: string
      start_date:
        type: string
      student_id:
        type: integer
      time_slot:
        enum:
        - 07-15
        - 10-15
        - 10-13
        type: string
    required:
    - academic_year_id
    - age_group
    - category
    - start_date
    - student_id
    - time_slot
    type: object
  dto.CreateDispensationRequest:
    properties:
      academic_year_id:
        type: integer
      discount_type:
        enum:
        - percent
        - fixed
        type: string
      discount_value:
        minimum: 1
        type: number
      end_month:
        maximum: 12
        minimum: 1
        type: integer
      end_year:
        minimum: 2020
        type: integer
      fee_category:
        enum:
        - monthly_spp
        - initial
        - daycare
        type: string
      is_permanent:
        type: boolean
      notes:
        type: string
      reason:
        maxLength: 100
        type: string
      start_month:
        maximum: 12
        minimum: 1
        type: integer
      start_year:
        minimum: 2020
        type: integer
    required:
    - academic_year_id
    - discount_type
    - discount_value
    - reason
    - start_month
    - start_year
    type: object
  dto.CreateEnrollmentRequest:
    properties:
      academic_year_id:
        type: integer
      class_group_id:
        type: integer
      enrollment_type:
        enum:
        - new
        - mutation
        - transfer
        type: string
      start_date:
        type: string
    required:
    - academic_year_id
    - class_group_id
    - start_date
    type: object
  dto.CreateExpenseCategoryRequest:
    properties:
      invoice_category:
        maxLength: 30
        type: string
      name:
        maxLength: 100
        type: string
      parent_id:
        type: integer
    required:
    - name
    type: object
  dto.CreateExpenseRequest:
    properties:
      academic_year_id:
        type: integer
      amount:
        minimum: 1
        type: number
      description:
        type: string
      expense_category_id:
        type: integer
      expense_date:
        type: string
      receipt_url:
        type: string
    required:
    - academic_year_id
    - amount
    - description
    - expense_category_id
    - expense_date
    type: object
  dto.CreateExtracurricularRequest:
    properties:
      levels:
        description: 'comma-separated: "intan,berlian". "" = all'
        type: string
      name:
        maxLength: 100
        type: string
      type:
        enum:
        - pasta
        type: string
    required:
    - name
    - type
    type: object
  dto.CreateFacilityRequest:
    properties:
      description:
        type: string
      name:
        maxLength: 100
        type: string
    required:
    - name
    type: object
  dto.CreateFeeConfigItemRequest:
    properties:
      amount:
        minimum: 0
        type: number
      category:
        enum:
        - initial
        - registration
        - monthly_spp
        - monthly_infaq
        - pasta
        - calisan
        - ekskul
        - savings_mandatory
        - daycare
        - graduation
        - facility
        type: string
      gender:
        enum:
        - all
        - L
        - P
        type: string
      is_active:
        type: boolean
      is_koperasi:
        type: boolean
      is_mandatory:
        type: boolean
      item_key:
        maxLength: 50
        type: string
      koperasi_product_id:
        type: integer
      level:
        enum:
        - all
        - mutiara
        - intan
        - berlian
        type: string
      name:
        maxLength: 100
        type: string
      start_month:
        maximum: 12
        minimum: 1
        type: integer
      unit:
        enum:
        - fixed
        - per_day
        - per_monday
        - percent
        type: string
    required:
    - amount
    - category
    - gender
    - item_key
    - level
    - name
    - unit
    type: object
  dto.CreateFeeConfigRequest:
    properties:
      academic_year_id:
        type: integer
      savings_admin_rate:
        maximum: 100
        minimum: 0
        type: number
    required:
    - academic_year_id
    - savings_admin_rate
    type: object
  dto.CreateGuardianInline:
    properties:
      address:
        type: string
      full_name:
        maxLength: 100
        type: string
      is_primary:
        type: boolean
      phone:
        maxLength: 20
        type: string
      relationship:
        enum:
        - ayah
        - ibu
        - wali
        type: string
    required:
    - full_name
    - phone
    - relationship
    type: object
  dto.CreateGuardianRequest:
    properties:
      address:
        type: string
      full_name:
        maxLength: 100
        type: string
      phone:
        maxLength: 20
        type: string
      relationship:
        enum:
        - ayah
        - ibu
        - wali
        type: string
    required:
    - full_name
    - phone
    - relationship
    type: object
  dto.CreateIncomeCategoryRequest:
    properties:
      code:
        maxLength: 30
        minLength: 2
        type: string
      name:
        maxLength: 100
        type: string
    required:
    - name
    type: object
  dto.CreateIncomeTransactionRequest:
    properties:
      academic_year_id:
        type: integer
      amount:
        minimum: 1
        type: number
      income_category_id:
        type: integer
      notes:
        type: string
      reference_number:
        maxLength: 50
        type: string
      source_name:
        maxLength: 100
        type: string
      transaction_date:
        type: string
    required:
    - academic_year_id
    - amount
    - income_category_id
    - source_name
    - transaction_date
    type: object
  dto.CreateInstallmentScheduleRequest:
    properties:
      installments:
        items:
          $ref: '#/definitions/dto.InstallmentItem'
        minItems: 1
        type: array
    required:
    - installments
    type: object
  dto.CreatePaymentRequest:
    properties:
      academic_year_id:
        type: integer
      incidental_items:
        items:
          $ref: '#/definitions/dto.IncidentalItemReq'
        type: array
      items:
        items:
          $ref: '#/definitions/dto.PaymentItemReq'
        type: array
      notes:
        type: string
      payment_date:
        type: string
      savings_deposit:
        minimum: 0
        type: number
      source:
        enum:
        - cash
        - savings
        type: string
      student_id:
        type: integer
    required:
    - academic_year_id
    - payment_date
    - source
    - student_id
    type: object
  dto.CreateStudentRequest:
    properties:
      academic_year_id:
        type: integer
      birth_date:
        type: string
      birth_place:
        maxLength: 100
        type: string
      class_group_id:
        description: 'Optional: langsung enroll ke kelas saat pendaftaran'
        type: integer
      enrollment_status:
        enum:
        - active
        - pending
        type: string
      enrollment_type:
        enum:
        - new
        - mutation
        type: string
      exceptionality:
        allOf:
        - $ref: '#/definitions/dto.ExceptionalityRequest'
        description: 'Optional: tandai siswa sebagai ABK (Anak Berkebutuhan Khusus)'
      full_name:
        maxLength: 100
        minLength: 3
        type: string
      gender:
        enum:
        - L
        - P
        type: string
      guardians:
        items:
          $ref: '#/definitions/dto.CreateGuardianInline'
        type: array
      is_daycare_only:
        type: boolean
      religion:
        maxLength: 30
        type: string
      start_date:
        type: string
    required:
    - birth_date
    - birth_place
    - full_name
    - gender
    type: object
  dto.CreateUserRequest:
    properties:
      email:
        type: string
      full_name:
        maxLength: 100
        minLength: 3
        type: string
      modules:
        items:
          type: string
        type: array
      password:
        minLength: 8
        type: string
      role:
        enum:
        - superadmin
        - admin
        type: string
    required:
    - email
    - full_name
    - password
    - role
    type: object
  dto.DailyClosingInReport:
    properties:
      difference:
        type: number
      is_confirmed:
        type: boolean
      notes:
        type: string
      physical_cash_amount:
        type: number
      system_cash_amount:
        type: number
    type: object
  dto.DailyClosingListResponse:
    properties:
      closed_by:
        $ref: '#/definitions/dto.UserBriefResponse'
      closing_date:
        type: string
      difference:
        type: number
      id:
        type: integer
      is_confirmed:
        type: boolean
      notes:
        type: string
      physical_cash_amount:
        type: number
      system_cash_amount:
        type: number
    type: object
  dto.DailyReportResponse:
    properties:
      academic_year:
        type: string
      cash:
        $ref: '#/definitions/dto.CashSummaryResponse'
      daily_closing:
        $ref: '#/definitions/dto.DailyClosingInReport'
      date:
        type: string
      expense_summary:
        $ref: '#/definitions/dto.ExpenseSummaryResponse'
      income_summary:
        $ref: '#/definitions/dto.IncomeSummaryResponse'
      vault:
        $ref: '#/definitions/dto.VaultSummaryResponse'
    type: object
  dto.DaycareAttendanceResponse:
    properties:
      date:
        type: string
      id:
        type: integer
      student_id:
        type: integer
      time_slot:
        type: string
      with_meal:
        type: boolean
      with_tpq:
        type: boolean
    type: object
  dto.DaycareEnrollmentResponse:
    properties:
      academic_year:
        $ref: '#/definitions/dto.AcademicYearBriefResponse'
      age_group:
        type: string
      category:
        type: string
      end_date:
        type: string
      id:
        type: integer
      package_type:
        type: string
      start_date:
        type: string
      status:
        type: string
      student:
        $ref: '#/definitions/dto.StudentBriefResponse'
      time_slot:
        type: string
    type: object
  dto.DaycareMonthlyAttendanceResponse:
    properties:
      academic_year_id:
        type: integer
      id:
        type: integer
      meal_days:
        type: integer
      month:
        type: integer
      overtime_amount:
        type: number
      overtime_minutes:
        type: integer
      spd_days:
        type: integer
      student_id:
        type: integer
      student_name:
        type: string
      year:
        type: integer
    type: object
  dto.DaycareSyncError:
    properties:
      message:
        type: string
      student_id:
        type: integer
    type: object
  dto.DaycareSyncResult:
    properties:
      errors:
        items:
          $ref: '#/definitions/dto.DaycareSyncError'
        type: array
      total_enrollments:
        type: integer
      total_skipped:
        type: integer
      total_synced:
        type: integer
    type: object
  dto.DeleteDaycareEnrollmentResponse:
    properties:
      message:
        type: string
      unpaid_invoices:
        items:
          $ref: '#/definitions/dto.UnpaidInvoiceBrief'
        type: array
      warning:
        type: boolean
    type: object
  dto.DispensationResponse:
    properties:
      academic_year:
        $ref: '#/definitions/dto.AcademicYearBriefResponse'
      created_at:
        type: string
