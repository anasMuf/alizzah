basePath: /api
definitions:
  dto.AcademicYearResponse:
    properties:
      created_at:
        type: string
      end_date:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      start_date:
        type: string
    type: object
  dto.ClassGroupResponse:
    properties:
      academic_year_id:
        type: integer
      id:
        type: integer
      level:
        type: string
      name:
        type: string
      schedule:
        $ref: '#/definitions/dto.ClassGroupSchedule'
      student_count:
        type: integer
    type: object
  dto.ClassGroupSchedule:
    properties:
      weekdays:
        $ref: '#/definitions/dto.ScheduleBlock'
      weekend:
        $ref: '#/definitions/dto.ScheduleBlock'
    type: object
  dto.CreateAcademicYearRequest:
    properties:
      end_date:
        type: string
      name:
        maxLength: 20
        type: string
      start_date:
        type: string
    required:
    - end_date
    - name
    - start_date
    type: object
  dto.CreateClassGroupRequest:
    properties:
      academic_year_id:
        type: integer
      level:
        enum:
        - mutiara
        - intan
        - berlian
        type: string
      name:
        maxLength: 50
        type: string
      schedule:
        $ref: '#/definitions/dto.ClassGroupSchedule'
    required:
    - academic_year_id
    - level
    - name
    - schedule
    type: object
  dto.CreateExpenseCategoryRequest:
    properties:
      name:
        maxLength: 100
        type: string
      parent_id:
        type: integer
    required:
    - name
    type: object
  dto.CreateExpenseRequest:
    properties:
      academic_year_id:
        type: integer
      amount:
        minimum: 1
        type: number
      description:
        type: string
      expense_category_id:
        type: integer
      expense_date:
        type: string
      receipt_url:
        type: string
    required:
    - academic_year_id
    - amount
    - description
    - expense_category_id
    - expense_date
    type: object
  dto.CreateGuardianInline:
    properties:
      address:
        type: string
      full_name:
        maxLength: 100
        type: string
      is_primary:
        type: boolean
      phone:
        maxLength: 20
        type: string
      relationship:
        enum:
        - ayah
        - ibu
        - wali
        type: string
    required:
    - full_name
    - phone
    - relationship
    type: object
  dto.CreateGuardianRequest:
    properties:
      address:
        type: string
      full_name:
        maxLength: 100
        type: string
      phone:
        maxLength: 20
        type: string
      relationship:
        enum:
        - ayah
        - ibu
        - wali
        type: string
    required:
    - full_name
    - phone
    - relationship
    type: object
  dto.CreatePaymentRequest:
    properties:
      academic_year_id:
        type: integer
      items:
        items:
          $ref: '#/definitions/dto.PaymentItemReq'
        type: array
      notes:
        type: string
      payment_date:
        type: string
      savings_deposit:
        minimum: 0
        type: number
      source:
        enum:
        - cash
        - savings
        type: string
      student_id:
        type: integer
    required:
    - academic_year_id
    - payment_date
    - source
    - student_id
    type: object
  dto.CreateStudentRequest:
    properties:
      birth_date:
        description: Changed validation datetime format to custom
        type: string
      birth_place:
        maxLength: 100
        type: string
      full_name:
        maxLength: 100
        minLength: 3
        type: string
      gender:
        enum:
        - L
        - P
        type: string
      guardians:
        items:
          $ref: '#/definitions/dto.CreateGuardianInline'
        type: array
      is_daycare_only:
        type: boolean
      religion:
        maxLength: 30
        type: string
    required:
    - birth_date
    - birth_place
    - full_name
    - gender
    type: object
  dto.CreateUserRequest:
    properties:
      email:
        type: string
      full_name:
        maxLength: 100
        minLength: 3
        type: string
      password:
        minLength: 8
        type: string
      role:
        enum:
        - superadmin
        - admin_administrasi
        - admin_keuangan
        - kepala_sekolah
        - yayasan
        type: string
    required:
    - email
    - full_name
    - password
    - role
    type: object
  dto.EnrollmentBriefResponse:
    properties:
      academic_year_id:
        type: integer
      academic_year_name:
        type: string
      class_group_id:
        type: integer
      class_group_name:
        type: string
      id:
        type: integer
      level:
        type: string
      start_date:
        type: string
      status:
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
      status:
        type: integer
    type: object
  dto.ExpenseCategoryBrief:
    properties:
      id:
        type: integer
      name:
        type: string
      parent_name:
        type: string
    type: object
  dto.ExpenseCategoryResponse:
    properties:
      children:
        items:
          $ref: '#/definitions/dto.ExpenseCategoryResponse'
        type: array
      id:
        type: integer
      name:
        type: string
      parent_id:
        type: integer
    type: object
  dto.ExpenseResponse:
    properties:
      amount:
        type: number
      category:
        $ref: '#/definitions/dto.ExpenseCategoryBrief'
      created_at:
        type: string
      created_by:
        $ref: '#/definitions/dto.UserBriefResponse'
      description:
        type: string
      expense_date:
        type: string
      id:
        type: integer
      receipt_url:
        type: string
    type: object
  dto.FinancialSummaryResponse:
    properties:
      savings_general_balance:
        type: number
      savings_mandatory_balance:
        type: number
      total_unpaid:
        type: number
    type: object
  dto.GuardianBriefResponse:
    properties:
      full_name:
        type: string
      id:
        type: integer
      is_primary:
        type: boolean
      phone:
        type: string
      relationship:
        type: string
    type: object
  dto.GuardianResponse:
    properties:
      address:
        type: string
      full_name:
        type: string
      id:
        type: integer
      phone:
        type: string
      relationship:
        type: string
      students:
        items:
          $ref: '#/definitions/dto.StudentBriefResponse'
        type: array
    type: object
  dto.ImportResult:
    properties:
      error:
        type: string
      name:
        type: string
      row:
        type: integer
      success:
        type: boolean
    type: object
  dto.ImportSummaryResponse:
    properties:
      details:
        items:
          $ref: '#/definitions/dto.ImportResult'
        type: array
      total_failed:
        type: integer
      total_processed:
        type: integer
      total_success:
        type: integer
    type: object
  dto.LinkGuardianRequest:
    properties:
      guardian_id:
        type: integer
      is_primary:
        type: boolean
    required:
    - guardian_id
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.Meta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  dto.PaginatedResponse:
    properties:
      data: {}
      message:
        type: string
      meta:
        $ref: '#/definitions/dto.Meta'
    type: object
  dto.PaymentDetailResponse:
    properties:
      created_at:
        type: string
      created_by:
        $ref: '#/definitions/dto.UserBriefResponse'
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/dto.PaymentItemResponse'
        type: array
      notes:
        type: string
      payment_date:
        type: string
      source:
        type: string
      student:
        $ref: '#/definitions/dto.StudentBriefResponse'
      total_amount:
        type: number
    type: object
  dto.PaymentItemReq:
    properties:
      amount:
        minimum: 1
        type: number
      invoice_item_id:
        type: integer
    required:
    - amount
    - invoice_item_id
    type: object
  dto.PaymentItemResponse:
    properties:
      amount:
        type: number
      id:
        type: integer
      invoice_item_id:
        type: integer
      invoice_item_name:
        type: string
    type: object
  dto.PaymentListResponse:
    properties:
      created_at:
        type: string
      created_by:
        $ref: '#/definitions/dto.UserBriefResponse'
      id:
        type: integer
      payment_date:
        type: string
      source:
        type: string
      student:
        $ref: '#/definitions/dto.StudentBriefResponse'
      total_amount:
        type: number
    type: object
  dto.SavingsBalanceResponse:
    properties:
      balance:
        type: number
      id:
        type: integer
      type:
        type: string
    type: object
  dto.SavingsTransactionResponse:
    properties:
      admin_fee:
        type: number
      amount:
        type: number
      created_at:
        type: string
      id:
        type: integer
      net_amount:
        type: number
      notes:
        type: string
      savings_type:
        type: string
      source_type:
        type: string
      transaction_type:
        type: string
    type: object
  dto.SavingsWithdrawalRequest:
    properties:
      amount:
        minimum: 1
        type: number
      notes:
        type: string
    required:
    - amount
    type: object
  dto.ScheduleBlock:
    properties:
      days:
        items:
          type: string
        type: array
      time_in:
        type: string
      time_out:
        type: string
      time_out_calisan:
        type: string
    type: object
  dto.StudentBriefResponse:
    properties:
      full_name:
        type: string
      gender:
        type: string
      id:
        type: integer
      status:
        type: string
    type: object
  dto.StudentDetailResponse:
    properties:
      birth_date:
        type: string
      birth_place:
        type: string
      created_at:
        type: string
      current_enrollment:
        $ref: '#/definitions/dto.EnrollmentBriefResponse'
      financial_summary:
        $ref: '#/definitions/dto.FinancialSummaryResponse'
      full_name:
        type: string
      gender:
        type: string
      guardians:
        items:
          $ref: '#/definitions/dto.GuardianBriefResponse'
        type: array
      id:
        type: integer
      is_daycare_only:
        type: boolean
      photo_url:
        type: string
      religion:
        type: string
      status:
        type: string
    type: object
  dto.StudentListResponse:
    properties:
      birth_date:
        type: string
      current_enrollment:
        $ref: '#/definitions/dto.EnrollmentBriefResponse'
      full_name:
        type: string
      gender:
        type: string
      id:
        type: integer
      is_daycare_only:
        type: boolean
      status:
        type: string
    type: object
  dto.StudentSavingsResponse:
    properties:
      general:
        $ref: '#/definitions/dto.SavingsBalanceResponse'
      mandatory:
        $ref: '#/definitions/dto.SavingsBalanceResponse'
    type: object
  dto.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
    type: object
  dto.UpdateStudentRequest:
    properties:
      birth_date:
        type: string
      birth_place:
        maxLength: 100
        type: string
      full_name:
        maxLength: 100
        minLength: 3
        type: string
      gender:
        enum:
        - L
        - P
        type: string
      is_daycare_only:
        type: boolean
      religion:
        maxLength: 30
        type: string
    required:
    - birth_date
    - birth_place
    - full_name
    - gender
    type: object
  dto.UpdateUserRequest:
    properties:
      email:
        type: string
      full_name:
        maxLength: 100
        minLength: 3
        type: string
      password:
        minLength: 8
        type: string
      role:
        enum:
        - superadmin
        - admin_administrasi
        - admin_keuangan
        - kepala_sekolah
        - yayasan
        type: string
    required:
    - email
    - full_name
    - role
    type: object
  dto.UserBriefResponse:
    properties:
      full_name:
        type: string
      id:
        type: integer
    type: object
  dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      role:
        type: string
    type: object
  dto.WithdrawalResponse:
    properties:
      admin_fee:
        type: number
      amount:
        type: number
      net_amount:
        type: number
      remaining_balance:
        type: number
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for Alizzah School Management System
  title: Alizzah Manajemen API
  version: "1.0"
paths:
  /expense-categories:
    get:
      consumes:
      - application/json
      description: Get a tree of expense categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ExpenseCategoryResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get expense category list
      tags:
      - expense-categories
    post:
      consumes:
      - application/json
      description: Create a new expense category (max 2 levels deep)
      parameters:
      - description: Create category request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateExpenseCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ExpenseCategoryResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Create expense category
      tags:
      - expense-categories
  /expense-categories/{id}:
    delete:
      consumes:
      - application/json
      description: Delete an existing expense category (only if it has no children
        and no expenses)
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Delete expense category
      tags:
      - expense-categories
    put:
      consumes:
      - application/json
      description: Update an existing expense category
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update category request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateExpenseCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ExpenseCategoryResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Update expense category
      tags:
      - expense-categories
  /expenses:
    get:
      consumes:
      - application/json
      description: Get a paginated list of expenses
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Limit per page
        in: query
        name: limit
        type: integer
      - description: Academic Year ID
        in: query
        name: academic_year_id
        type: integer
      - description: Expense Category ID
        in: query
        name: expense_category_id
        type: integer
      - description: Start Date (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: End Date (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ExpenseResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
