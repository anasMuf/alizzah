  dto.StudentSavingsResponse:
    properties:
      general:
        $ref: '#/definitions/dto.SavingsBalanceResponse'
      mandatory:
        $ref: '#/definitions/dto.SavingsBalanceResponse'
    type: object
  dto.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
