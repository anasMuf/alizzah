      quantity:
        type: integer
      unit_price:
        description: kosong → pakai harga jual varian
        minimum: 0
        type: number
      variant_id:
        type: integer
    required:
    - quantity
    type: object
  penjualan.CreateRequest:
    properties:
      academic_year_id:
        type: integer
      buyer_name:
        maxLength: 100
        type: string
      initial_payment:
        minimum: 0
        type: number
      items:
        items:
          $ref: '#/definitions/penjualan.CreateItemRequest'
        minItems: 1
        type: array
      notes:
        type: string
      payment_method:
        enum:
        - cash
        type: string
      sale_date:
        type: string
      student_id:
        type: integer
    required:
    - academic_year_id
    - items
    - sale_date
    type: object
  penjualan.ItemResponse:
    properties:
      product_id:
        type: integer
