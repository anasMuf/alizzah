  dto.StudentListResponse:
    properties:
      birth_date:
        type: string
      current_enrollment:
        $ref: '#/definitions/dto.EnrollmentBriefResponse'
      full_name:
        type: string
      gender:
        type: string
      id:
        type: integer
      is_daycare_only:
        type: boolean
      status:
        type: string
    type: object
  dto.StudentPaymentStatusInReport:
    properties:
      invoice_status:
        type: string
