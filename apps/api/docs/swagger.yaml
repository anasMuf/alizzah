      - application/json
      description: Menampilkan semua file backup yang tersedia di direktori backup
        VPS.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
