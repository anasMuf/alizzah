# Host nginx — Alizzah API  (Debian: /etc/nginx/sites-available/alizzah-api)
# Site ini SUDAH ADA & sudah punya sertifikat. Cukup ganti target proxy:
#     proxy_pass http://localhost:3011;   (LAMA, PM2)
#  -> proxy_pass http://127.0.0.1:8091;   (BARU, container)
#
# Versi final yang diinginkan (blok 443 dikelola certbot, biarkan apa adanya):

# Rate limiting zone — anti brute-force & abuse (shared across all server blocks)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;

server {
    server_name api.alizzah.anaslabs.my.id;

    server_tokens off;

    # Security headers (applied to all proxied responses)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limit on auth endpoints (brute-force protection)
    location /api/v1/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 5m;
    }

    # Koperasi — binary terpisah (container koperasi-api :8092), tapi share domain
    # & TLS yang sama. Path lebih spesifik dari /, jadi nginx akan routing
    # request /api/v1/koperasi/* ke container koperasi, sisanya ke container api.
    location /api/v1/koperasi {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8092;        # <-- container koperasi-api (compose: KOPERASI_API_PORT)
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 25m;
    }

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8091;        # <-- container api (compose: API_PORT)
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 25m;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.alizzah.anaslabs.my.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.alizzah.anaslabs.my.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.alizzah.anaslabs.my.id) { return 301 https://$host$request_uri; } # managed by Certbot
    listen 80;
    server_name api.alizzah.anaslabs.my.id;
    return 404; # managed by Certbot
}
