# Host nginx — Alizzah API  (Debian: /etc/nginx/sites-available/alizzah-api)
# Site ini SUDAH ADA & sudah punya sertifikat. Cukup ganti target proxy:
#     proxy_pass http://localhost:3011;   (LAMA, PM2)
#  -> proxy_pass http://127.0.0.1:8091;   (BARU, container)
#
# Versi final yang diinginkan (blok 443 dikelola certbot, biarkan apa adanya):

server {
    server_name api.alizzah.anaslabs.my.id;

    # Koperasi — binary terpisah (container koperasi-api :8092), tapi share domain
    # & TLS yang sama. Path lebih spesifik dari /, jadi nginx akan routing
    # request /api/v1/koperasi/* ke container koperasi, sisanya ke container api.
    location /api/v1/koperasi {
        proxy_pass http://127.0.0.1:8092;        # <-- container koperasi-api (compose: KOPERASI_API_PORT)
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 25m;
    }

    location / {
        proxy_pass http://127.0.0.1:8091;        # <-- container api (compose: API_PORT)
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 25m;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.alizzah.anaslabs.my.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.alizzah.anaslabs.my.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.alizzah.anaslabs.my.id) { return 301 https://$host$request_uri; } # managed by Certbot
    listen 80;
    server_name api.alizzah.anaslabs.my.id;
    return 404; # managed by Certbot
}
