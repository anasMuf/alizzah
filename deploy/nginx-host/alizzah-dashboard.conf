# Host nginx — Alizzah Dashboard  (Debian: /etc/nginx/sites-available/alizzah-dashboard)
# Site BARU. Langkah:
#   1) Simpan blok HTTP minimal di bawah (tanpa 443 dulu).
#   2) Aktifkan:  sudo ln -s /etc/nginx/sites-available/alizzah-dashboard /etc/nginx/sites-enabled/
#   3) Terbitkan TLS:  sudo certbot --nginx -d dashboard.alizzah.anaslabs.my.id
#      (certbot otomatis menambah blok 443 + redirect 80->443)
#   4) sudo nginx -t && sudo systemctl reload nginx

server {
    server_name dashboard.alizzah.anaslabs.my.id;

    location / {
        proxy_pass http://127.0.0.1:8090;        # <-- container dashboard (compose: WEB_PORT)
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}
