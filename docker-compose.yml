# Stack PRODUKSI Alizzah (VPS multi-app, di belakang nginx HOST).
# Container hanya expose ke localhost; nginx host yang terminate TLS & proxy.
# Variabel dibaca dari `.env` di direktori yang sama (lihat .env.production.example).
#
#   docker compose pull && docker compose up -d
#
name: alizzah

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 128m
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [appnet]
    # Tidak publish port — DB internal saja.

  api:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER}/alizzah-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SSL_MODE: disable
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      APP_ENV: ${APP_ENV:-production}
      BACKUP_DIR: /backups
    volumes:
      - ${BACKUP_VOLUME:-~/backups/alizzah-app}:/backups
    # Hanya di loopback host → di-proxy nginx host
    ports:
      - "127.0.0.1:${API_PORT:-8091}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [appnet]

  # Binary koperasi (cmd/koperasi) — image sama, entrypoint berbeda.
  # Deploy/restart independen dari `api`; berbagi Postgres yang sama.
  # Memigrasi tabel koperasi_* sendiri, jadi hanya bergantung pada postgres.
  koperasi-api:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER}/alizzah-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    entrypoint: ["/app/koperasi"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KOPERASI_PORT: "8081"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${KOPERASI_CORS_ALLOWED_ORIGINS:-${CORS_ALLOWED_ORIGINS}}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SSL_MODE: disable
    ports:
      - "127.0.0.1:${KOPERASI_API_PORT:-8092}:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [appnet]

  dashboard:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER}/alizzah-dashboard:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [appnet]

volumes:
  pgdata:

networks:
  appnet:
